plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.widgetv.home'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.widgetv.home'
        minSdk 25
        targetSdk 34
        versionCode 22
        versionName '1.2-api25'
    }

    androidResources {
        noCompress += ['mp4']
    }

    buildFeatures {
        buildConfig true // BuildConfig.DEBUG guards the adb preview hooks
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def releaseStore = System.getenv('WIDGETV_KEYSTORE')
    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('WIDGETV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WIDGETV_KEY_ALIAS')
                keyPassword System.getenv('WIDGETV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.palette:palette:1.0.0'
    // Offline prayer-time calculation (MIT, no transitive dependencies); same version as Afnon.
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
}
