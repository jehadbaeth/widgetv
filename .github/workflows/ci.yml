name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Decode the release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WIDGETV_KEYSTORE_BASE64: ${{ secrets.WIDGETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$WIDGETV_KEYSTORE_BASE64" ]; then
            printf '%s' "$WIDGETV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/widgetv.keystore"
          fi

      - name: Build the release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: launcher
        env:
          WIDGETV_KEYSTORE: ${{ runner.temp }}/widgetv.keystore
          WIDGETV_KEYSTORE_PASSWORD: ${{ secrets.WIDGETV_KEYSTORE_PASSWORD }}
          WIDGETV_KEY_ALIAS: ${{ secrets.WIDGETV_KEY_ALIAS }}
          WIDGETV_KEY_PASSWORD: ${{ secrets.WIDGETV_KEY_PASSWORD }}
        run: |
          if [ ! -s "$WIDGETV_KEYSTORE" ]; then
            unset WIDGETV_KEYSTORE WIDGETV_KEYSTORE_PASSWORD WIDGETV_KEY_ALIAS WIDGETV_KEY_PASSWORD
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Build the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: launcher
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: launcher/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: widgetv-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
