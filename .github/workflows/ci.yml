name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 34
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            ANDROID_HOME="$ANDROID_SDK_ROOT"
          elif [ -z "${ANDROID_HOME:-}" ]; then
            ANDROID_HOME="$RUNNER_TEMP/android-sdk"
            mkdir -p "$ANDROID_HOME"
          fi
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdtools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Decode the release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WIDGETV_KEYSTORE_BASE64: ${{ secrets.WIDGETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$WIDGETV_KEYSTORE_BASE64" ]; then
            printf '%s' "$WIDGETV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/widgetv.keystore"
          fi

      - name: Build the release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: launcher
        env:
          WIDGETV_KEYSTORE: ${{ runner.temp }}/widgetv.keystore
          WIDGETV_KEYSTORE_PASSWORD: ${{ secrets.WIDGETV_KEYSTORE_PASSWORD }}
          WIDGETV_KEY_ALIAS: ${{ secrets.WIDGETV_KEY_ALIAS }}
          WIDGETV_KEY_PASSWORD: ${{ secrets.WIDGETV_KEY_PASSWORD }}
        run: |
          if [ ! -s "$WIDGETV_KEYSTORE" ]; then
            unset WIDGETV_KEYSTORE WIDGETV_KEYSTORE_PASSWORD WIDGETV_KEY_ALIAS WIDGETV_KEY_PASSWORD
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Build the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: launcher
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="widgetv-${GITHUB_REF_NAME#v}.apk"
          cp launcher/app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload the debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: widgetv-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
